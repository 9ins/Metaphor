/*
 * This file was generated by the Gradle 'init' task.
 */
plugins {
    // Spring Boot plugin for building Spring Boot applications
    id 'org.springframework.boot' version '3.3.3'
    
    // Dependency management plugin
    id 'io.spring.dependency-management' version '1.1.0'
        
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'maven-publish'
    id 'signing'    
}

archivesBaseName = 'metaphor'
group = "io.github.9ins"
version = '1.0.1'
sourceCompatibility = '17' 
compileJava.options.encoding = 'utf-8'

// Task to generate Javadoc JAR
task javadocJar(type: Jar) {
    archiveClassifier.set('javadoc')
    from javadoc
}

// Task to generate sources JAR
task sourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from sourceSets.main.allSource
}

// Configure the maven-publish plugin to publish to the Maven repository
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifact javadocJar
            artifact sourcesJar

            pom {
                name.set('Metaphor')
                packaging = 'jar'
                description.set('This library contributes to making charts on AWT/Swing/SWT components. It can be used for AWT/Swing applications and Eclipse SWT (Standard Widget Toolkit) applications. If you would try to build a service of RAP dashboard web application, this library will provide great UX experience and excellent interactive functionality to the service for users.')
                url.set('https://github.com/9ins/Metaphor')

                scm {
                    connection.set('scm:git:https://github.com/9ins/Metaphor.git')
                    developerConnection.set('scm:git:https://github.com/9ins/Metaphor.git')
                    url.set('https://github.com/9ins/Metaphor.git')
                }

                licenses {
                    license {
                        name.set('The Apache License, Version 2.0')
                        url.set('http://www.apache.org/licenses/LICENSE-2.0.txt')
                    }
                }

                developers {
                    developer {
                        id.set('chaos930')
                        name.set('Kooin Shin')
                        email.set('chaos930@gmail.com')
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url = uri("https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/")
            credentials {
                username = findProperty("ossrhUsername")
                password = findProperty("ossrhPassword")
            }
        }

        maven {
            name = "snapshots"
            url = uri("https://s01.oss.sonatype.org/content/repositories/snapshots/")
            credentials {
                username = findProperty("ossrhUsername")
                password = findProperty("ossrhPassword")
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}

tasks.withType(JavaCompile) {
    options.encoding = 'utf-8'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral() 
}

dependencies {
    implementation ('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation ('org.springframework.boot:spring-boot-starter-security') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation ('org.springframework.boot:spring-boot-starter-aop') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation ('org.springframework.boot:spring-boot-starter-logging') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-properties:2.17.2'
    implementation 'com.auth0:java-jwt:4.2.1'
    implementation 'commons-cli:commons-cli:1.5.0'
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
}

application {
    mainClass = 'org.chaostocosmos.metadata.metaphor.MetaAPIServer'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'metaphor',
                   'Implementation-Version': version
    }
    doFirst {
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
