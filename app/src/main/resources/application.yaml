# Server configuration
server:
  port: 9999  # Default port for the embedded Tomcat server
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: '123456'
    key-store-type: PKCS12
    key-alias: springboot

# Spring Boot application name
spring:
  application:
    name: MetaAPIServer  # Name of the application
    version: 0.0.1
  #main:
  #  banner-mode: "off"
  banner:
    location: classpath:trademark
  session:
    timeout: 10s
   
  security:  
    cors: true
    csrf: false  
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

    # JWT Configuration
    jwt:
      secret: mysecret  # Secret key used for signing JWT tokens
      expiration: 86400000  # Token expiration time in milliseconds (e.g., 1 day)
      prefix: Bearer  # Prefix for the JWT token in the Authorization header
    
    roles:
      ROLE_ADMIN: 
        - "/**"
      ROLE_DEVELOPER:
        - "/development/**"
        - "/users/**"
        - "/**"
      ROLE_USER:
        - "/public/**"
        - "/users/**"

    users:
      - name: admin
        password: 1234
        roles:
          - ROLE_ADMIN
      - name: user
        password: 1234
        roles:
          - ROLE_USER    
      - name: developer
        password: 1234
        roles:
          - ROLE_ADMIN
          - ROLE_DEVELOPER


# Logging configuration
logging:
  file: 
    path: logs
    name: metaphor.log
  level:
    root: INFO  # Default log level for the root logger


